  <!-- Schema.org JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "Train Book Easy",
        "legalName": "Train Book Easy LLC",
        "url": "https://www.trainbookeasy.com",
        "logo": "https://www.trainbookeasy.com/assets/images/logo.png",
        "telephone": "+1-888-821-6270",
        "email": "support@trainbookeasy.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "100 Montgomery Street, Suite 1500",
          "addressLocality": "San Francisco",
          "addressRegion": "CA",
          "postalCode": "94104",
          "addressCountry": "US"
        },
        "description": "Independent train travel search and telephone booking assistance service."
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://www.trainbookeasy.com/"
          }
        ]
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I search for a train route?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Enter your departure city or station code in the 'From' field, select your destination in the 'To' field, choose your travel date, and select passenger count."
            }
          },
          {
            "@type": "Question",
            "name": "Are you an official railway company?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Train Book Easy is an independent travel assistance and route information platform. We are not Amtrak, a government transit agency, or an official rail carrier."
            }
          }
        ]
      }
    ]
  }
